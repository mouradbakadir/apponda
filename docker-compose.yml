services:
  postgres:
    image: postgres:16
    container_name: onda_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - onda_postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: onda_adminer
    restart: unless-stopped
    ports:
      - "8088:8080"
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    container_name: onda_frontend
    restart: unless-stopped
    ports:
      - "5173:8080"
    environment:
      PORT: 8080
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    container_name: onda_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - onda_redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onda_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4000:4000"
    depends_on:
      - postgres
      - redis
    volumes:
      # Le worker et l'API doivent lire/écrire les MÊMES fichiers PDF stockés
      # sur disque (storageService.js). Sans volume partagé, un PDF uploadé
      # via l'API ne serait pas visible par le conteneur worker (systèmes de
      # fichiers isolés par conteneur), et l'extraction échouerait avec une
      # erreur "Fichier introuvable sur le disque" (voir storageService.js).
      - onda_storage:/app/storage

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: onda_worker
    restart: unless-stopped
    # Le worker réutilise exactement la même image Docker que l'API (mêmes
    # dépendances, même client Prisma généré) : seule la commande de
    # démarrage change. Voir la note dans backend/src/worker.js sur les
    # raisons de séparer worker et API en deux processus distincts.
    command: ["node", "src/worker.js"]
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      OLLAMA_BASE_URL: http://host.docker.internal:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - postgres
      - redis
    volumes:
      - onda_storage:/app/storage
    # Pas de "ports" ici : le worker ne sert aucune requête HTTP, il ne fait
    # que consommer la queue Redis. L'exposer sur un port n'aurait aucun sens
    # et ouvrirait une surface d'attaque inutile.

volumes:
  onda_postgres_data:
  onda_redis_data:
  onda_storage: